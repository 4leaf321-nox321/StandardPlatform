# **apptainer 는 우분투 기본 저장소에 없다.** 공식 PPA 에서 온다.
#
# 기본 저장소에 있다고 적으면 `Unable to locate package apptainer` 로 죽는데
# (apt 는 exit 100 을 낸다), 그 메시지는 「없다」 고만 말하지 **어디서 받아야
# 하는지는 말하지 않는다.** 실측으로 겪었다 — 이 저장소의 첫 CI 가 그것으로
# 실패했고, 그때까지 이미지 잡은 한 번도 성공한 적이 없었다.
#
# **두 워크플로(ci·release)가 같은 설치를 한다.** 두 벌로 적으면 한쪽만
# 고쳐지고, 그때부터 「CI 는 도는데 릴리스는 안 되는」 상태가 된다 — 그리고
# 그것은 배포하려는 날에 드러난다.
#
# 개발 기계도 같은 PPA 에서 받는다. 지형이 다르면 한쪽은 아무도 안 돌려 본
# 쪽이 되고, 그 사실은 그쪽으로 배포하려는 날에야 보인다.

name: apptainer 설치
description: Apptainer 를 공식 PPA 에서 설치하고, 실제로 실행되는지 확인한다.

runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        # **바깥 저장소의 잠깐 장애에 릴리스가 떨어지지 않게 다시 시도한다.** v0.4.89 의
        # 릴리스가 Launchpad PPA 의 503 으로 두 번 떨어졌다(2026-11-17 — CI 는 통과, 목록은
        # 200 인데 .deb 파일만 503 이 섞였다). apt 자체의 재시도(`Acquire::Retries`)에 더해,
        # 목록 받기 · 설치 묶음을 통째로 몇 번 다시 한다 — `update` 는 PPA 목록을 못 받아도
        # 경고만 내고 0 으로 끝나므로(`--error-on=any` 로 실패로 친다) 설치만 다시 해서는
        # 「패키지가 없다」 가 되풀이된다.
        APT=(-o Acquire::Retries=5)
        retry() {
          local n=1
          until "$@"; do
            if [ "$n" -ge 5 ]; then return 1; fi
            echo "다시 시도 $n/4 — $((n * 30))초 뒤: $*"
            sleep $((n * 30))
            n=$((n + 1))
          done
        }
        retry sudo apt-get "${APT[@]}" update
        # add-apt-repository 를 주는 패키지. 러너에는 이미 있지만, 없는 이미지로
        # 바뀌는 날 이 줄이 없으면 다음 줄이 「명령이 없다」 로 죽는다.
        retry sudo apt-get "${APT[@]}" install -y --no-install-recommends software-properties-common
        retry sudo add-apt-repository -y -n ppa:apptainer/ppa
        # 여기서는 recommends 를 막지 않는다 — 빠진 조각은 **빌드할 때**
        # 드러나고, 그 오류는 설치를 가리키지 않는다.
        retry bash -c "sudo apt-get ${APT[*]} update --error-on=any && sudo apt-get ${APT[*]} install -y apptainer"
        # **깔린 것과 도는 것은 다른 일이다.** 확인하고 넘어간다.
        apptainer --version
