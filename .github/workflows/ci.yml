# 검증 게이트.
#
# **DB 이름을 여기 박지 않는다.** `branding.py` 의 APP_SLUG 에서 읽는다 — 포크해서
# 이름을 바꾼 사람이 CI 까지 고쳐야 한다면 그것을 빠뜨리는 날이 오고, 그날 CI 는
# 옆 플랫폼의 DB 이름으로 돈다.
#
# **줄을 셋으로 나눴다.** 백엔드·프론트·이미지는 서로를 안 기다린다. 이미지 빌드가
# 따로 있는 이유는 `apptainer.def` 가 깨져도 **릴리스를 만들 때까지 안 드러나기**
# 때문이다 — 그때는 배포하려는 자리다.

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  # **릴리스가 이 워크플로를 그대로 불러 쓴다**(`release.yml` 의 verify).
  # 검증을 릴리스 쪽에 한 벌 더 적으면 언젠가 한쪽만 고쳐지고, 그때부터
  # 「CI 는 통과인데 릴리스는 다른 것을 본다」 가 된다.
  workflow_call:

jobs:
  backend:
    name: 백엔드 (ruff · mypy · pytest · alembic)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'
          cache: 'pip'
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      # 플랫폼 이름을 코드에서 읽는다. 아래 단계들이 이 값으로 DB 를 만든다.
      - name: 플랫폼 이름 읽기
        id: platform
        run: |
          slug=$(python - <<'PY'
          import ast, pathlib
          tree = ast.parse(pathlib.Path('backend/app/branding.py').read_text(encoding='utf-8'))
          for node in tree.body:
              if isinstance(node, ast.Assign) and node.targets[0].id == 'APP_SLUG':
                  print(ast.literal_eval(node.value))
          PY
          )
          [ -n "$slug" ] || { echo "branding.py 에서 APP_SLUG 를 읽지 못했습니다"; exit 1; }
          echo "APP_SLUG = $slug"
          echo "slug=$slug" >> "$GITHUB_OUTPUT"

      - name: 백엔드 의존성
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: 린트 (ruff)
        working-directory: backend
        run: |
          python -m ruff check .
          python -m ruff format --check .

      - name: 타입 (mypy strict)
        working-directory: backend
        run: python -m mypy

      # conftest 가 DATABASE_URL 에서 <이름>_test 를 파생해 만든다. **개발 DB 를
      # 건드리지 않는** 구조가 CI 에서도 그대로 성립한다.
      - name: 테스트 (pytest)
        working-directory: backend
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/${{ steps.platform.outputs.slug }}
        run: |
          createdb -h localhost -U postgres '${{ steps.platform.outputs.slug }}_test'
          python -m pytest

      # **마이그레이션이 모델과 어긋났는지 본다.** 시험은 모델로 표를 만들기 때문에
      # 그 어긋남을 못 잡는다 — 그리고 그것은 배포하고 나서야 500 으로 드러난다.
      - name: 마이그레이션 정합 (alembic check)
        working-directory: backend
        env:
          PGPASSWORD: postgres
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/${{ steps.platform.outputs.slug }}
        run: |
          createdb -h localhost -U postgres '${{ steps.platform.outputs.slug }}'
          python -m alembic upgrade head
          python -m alembic check

  frontend:
    name: 프론트 (빌드 · vitest · oxlint · 생성물)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: 프론트엔드 의존성
        working-directory: frontend
        run: npm ci

      - name: 빌드 (tsc strict + vite)
        working-directory: frontend
        run: npm run build

      - name: 테스트 (vitest)
        working-directory: frontend
        run: npm test

      - name: 린트 (oxlint)
        working-directory: frontend
        run: npm run lint

      # **openapi.json 이 커밋된 것과 다르면 누군가 재생성을 빠뜨린 것이다.**
      # 프론트 타입이 그 파일에서 나오므로, 어긋난 날 화면은 아무 말도 안 하고
      # undefined 를 그린다.
      - name: 생성물 최신성 (openapi.json)
        run: |
          cd backend
          python -m pip install -r requirements.txt
          python scripts/export_openapi.py
          cd ../frontend
          npm run api:types
          test -f src/shared/api/schema.d.ts || { echo "타입 생성이 schema.d.ts 를 못 만들었습니다"; exit 1; }
          if ! git diff --quiet -- ../backend/openapi.json; then
            echo "openapi.json 이 최신이 아닙니다. scripts/export_openapi.py 를 돌리고 커밋하세요."
            exit 1
          fi

  image:
    name: 이미지 (apptainer 빌드)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v6
        with:
          python-version-file: '.python-version'

      - name: apptainer 설치
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends apptainer

      # **SIF 만 만들고 버린다.** 릴리스는 태그에서 따로 만든다 — 여기서 보려는
      # 것은 「.def 가 아직 빌드되는가」 하나다. 그것이 깨지면 릴리스를 만들려는
      # 자리에서야 드러나고, 그때는 배포하려던 순간이다.
      #
      # 러너에는 subuid/subgid 매핑이 없어 비특권 빌드가 실패한다 — sudo 로 켠다.
      - name: 번들 빌드
        env:
          USE_SUDO_APPTAINER: '1'
        run: ./deploy/build_bundle.sh "ci-${{ github.sha }}"

      - name: 번들이 자기가 무슨 플랫폼인지 말하는가
        run: |
          info=$(find release -name BUILD_INFO | head -1)
          [ -n "$info" ] || { echo "BUILD_INFO 가 없습니다"; exit 1; }
          cat "$info"
          for key in app_name app_slug port version; do
            grep -q "^$key=" "$info" || { echo "BUILD_INFO 에 $key 가 없습니다"; exit 1; }
          done
