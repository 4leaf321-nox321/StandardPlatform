[project]
name = "standard-platform-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"

# 의존성 정본은 requirements.txt 다. 폐쇄망 배포가 `pip wheel -r requirements.txt`
# 로 wheel 번들을 만들고 서버는 --no-index 로 설치하므로, 전이 의존성까지 고정된
# 파일이 하나 있어야 한다.

[tool.ruff]
line-length = 95
target-version = "py312"
src = [".", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI 의 의존성 주입은 기본값 자리에 Depends() 를 쓰는 것이 정식 문법이라
# B008(기본 인자에서 함수 호출)이 전부 오탐이 된다.
extend-immutable-calls = [
  "fastapi.Depends",
  "fastapi.Query",
  "fastapi.Path",
  "fastapi.Body",
  "fastapi.Header",
  "fastapi.File",
  "fastapi.Form",
]

[tool.ruff.lint.per-file-ignores]
# Alembic 이 생성한 파일은 손대지 않는 한 그대로 둔다. 여기를 린트에 맞추려고
# 생성 결과를 매번 손보면, 정작 사람이 쓴 부분의 변경이 묻힌다.
"migrations/versions/*" = ["E501", "I001", "UP035", "UP007"]
# 비교키 정규화는 **전각·유사 문자 자체가 소재**다. 그것을 "오타 아니냐" 고 묻는
# 검사와는 맞지 않는다 — 여기서는 그 문자가 정답이다.
"app/shared/text.py" = ["RUF002"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["app", "tests", "../mcp_server"]
# `mcp_server` 는 저장소 루트에 있다 — 배포 이미지에 안 들어가고 사람의 PC 에서
# 도는 것이라 백엔드 안에 두지 않았다. 그래도 **시험은 여기서 돈다**(진짜 앱에
# 붙여야 확인이 되므로), 그래서 타입 검사도 그 경로를 본다.
mypy_path = ".."

[[tool.mypy.overrides]]
module = ["uvicorn.*"]
ignore_missing_imports = true

# `mcp` 는 **배포에 안 들어간다** — MCP 서버는 사람의 PC 에서 돌기 때문이다
# (`mcp_server/requirements.txt`). 백엔드 개발 환경에 깔지 않으므로 여기서만
# 모르는 것으로 둔다. 알맹이(`tools.py`)는 httpx 만 쓰므로 그대로 검사된다.
[[tool.mypy.overrides]]
module = ["mcp.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
